<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TANEV GYO | Gayrimenkul & Portföy Yönetimi</title>
    <meta name="theme-color" content="#121214">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #121214;
            --bg-card: #1e1e24;
            --bg-input: #282830;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa8625;
            --text-white: #f8f9fa;
            --text-muted: #a0a0ab;
            --border-color: #33333d;
            --accent-red: #e63946;
            --accent-green: #2a9d8f;
            --radius-main: 16px;
            --radius-sm: 8px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-white); padding-bottom: 40px; }
        
        header { 
            background: rgba(18, 18, 20, 0.95); 
            backdrop-filter: blur(10px); 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            border-bottom: 1px solid var(--border-color); 
            padding: 10px 16px; 
        }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        
        /* Orijinal Logoyu Birebir Yerleştirdiğimiz Alan */
        .logo-box { display: flex; align-items: center; text-decoration: none; cursor: pointer; user-select: none; }
        .logo-img { height: 42px; width: auto; object-fit: contain; }
        
        .admin-controls { display: flex; gap: 10px; align-items: center; }
        .add-btn { background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark)); color: #000; font-weight: 700; border: none; padding: 10px 16px; border-radius: var(--radius-sm); font-size: 0.85rem; cursor: pointer; display: none; }
        
        .container { max-width: 1200px; margin: 20px auto; padding: 0 16px; }
        .info-banner { background: rgba(212, 175, 55, 0.08); border: 1px solid var(--gold-dark); border-radius: var(--radius-main); padding: 16px; margin-bottom: 24px; display: none; }
        .info-title { color: var(--gold-primary); font-weight: 700; font-size: 0.95rem; margin-bottom: 6px; }
        .info-text { font-size: 0.85rem; color: var(--text-muted); }
        
        .listings-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 768px) { .listings-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1024px) { .listings-grid { grid-template-columns: repeat(3, 1fr); } }
        
        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-main); overflow: hidden; display: flex; flex-direction: column; }
        .card-img-wrapper { position: relative; width: 100%; height: 220px; background: #2a2a32; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .card-badge { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.8); color: var(--gold-primary); border: 1px solid var(--gold-primary); padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }
        .card-status { position: absolute; top: 12px; right: 12px; background: var(--accent-green); color: #fff; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }
        
        .card-body { padding: 16px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; color: var(--text-white); }
        .card-price { font-size: 1.3rem; font-weight: 800; color: var(--gold-primary); margin-bottom: 12px; font-family: 'Montserrat', sans-serif; }
        .card-features { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); margin-bottom: 12px; font-size: 0.85rem; color: var(--text-muted); }
        .card-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; }
        
        .card-actions { display: none; gap: 8px; margin-top: auto; }
        .card-actions.admin-mode { display: flex; }
        .btn-action { flex: 1; padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); background: var(--bg-input); color: var(--text-white); font-size: 0.85rem; font-weight: 600; cursor: pointer; }
        .btn-edit { border-color: var(--gold-primary); color: var(--gold-primary); }
        .btn-delete { border-color: rgba(230, 57, 70, 0.4); color: var(--accent-red); flex: 0.3; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); z-index: 2000; display: none; justify-content: center; align-items: flex-end; }
        @media (min-width: 600px) { .modal-overlay { align-items: center; padding: 20px; } }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--bg-card); border: 1px solid var(--border-color); width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 20px; }
        @media (min-width: 600px) { .modal-content { border-radius: var(--radius-main); } }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
        .modal-title { font-size: 1.2rem; font-weight: 700; color: var(--gold-primary); }
        .modal-close { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
        
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text-white); }
        .form-control { width: 100%; padding: 12px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: var(--text-white); font-size: 0.95rem; outline: none; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn-submit { width: 100%; background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark)); color: #000; font-weight: 700; padding: 14px; border: none; border-radius: var(--radius-sm); font-size: 1rem; cursor: pointer; margin-top: 10px; }
        
        .file-input-wrapper { display: flex; flex-direction: column; gap: 8px; }
        .file-input-wrapper input[type="file"] { color: var(--text-muted); font-size: 0.85rem; background: var(--bg-input); padding: 8px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); }
        #imgPreview { width: 100px; height: 70px; object-fit: cover; border-radius: 6px; display: none; border: 1px solid var(--gold-primary); }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <!-- Gönderdiğiniz Orijinal Fotoğraf Doğrudan Logoya Eklendi -->
            <div class="logo-box" id="secretLogo" title="TANEV GYO">
                <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" id="logoImageDisplay" class="logo-img" alt="TANEV GYO">
            </div>
            
            <div class="admin-controls">
                <button class="add-btn" id="addBtn" onclick="openModal()">+ İlan Ekle</button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="info-banner" id="infoBanner">
            <div class="info-title">📌 Yönetici Modu Aktif</div>
            <div class="info-text">Şu an yönetim yetkilisiniz. İlan ekleyebilir, düzenleyebilir veya silebilirsiniz.</div>
        </div>
        <div class="listings-grid" id="listingsGrid"></div>
    </div>

    <!-- İlan Ekle / Düzenle Modal -->
    <div class="modal-overlay" id="propertyModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">Yeni İlan Ekle</div>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="propertyForm" onsubmit="saveProperty(event)">
                <input type="hidden" id="propId">
                <input type="hidden" id="propImageBase64">
                
                <div class="form-group">
                    <label class="form-label">İlan Başlığı</label>
                    <input type="text" id="propTitle" class="form-control" placeholder="Örn: Cadde Üzeri Devren İşyeri" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Fiyat (TL)</label>
                        <input type="text" id="propPrice" class="form-control" placeholder="Örn: 2.500.000 TL" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Kategori</label>
                        <select id="propCategory" class="form-control" required>
                            <option value="İşyeri">İşyeri</option>
                            <option value="Konut">Konut</option>
                            <option value="Arsa">Arsa</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Durum</label>
                        <select id="propStatus" class="form-control" required>
                            <option value="Satılık">Satılık</option>
                            <option value="Kiralık">Kiralık</option>
                            <option value="Devren Satılık">Devren Satılık</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Alan (m²)</label>
                        <input type="text" id="propArea" class="form-control" placeholder="Örn: 180 m²" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Konum (İlçe / Mahalle)</label>
                    <input type="text" id="propLocation" class="form-control" placeholder="Örn: Şehitkamil / Batıkent" required>
                </div>
                
                <!-- Galeriden Fotoğraf Seçme Alanı -->
                <div class="form-group">
                    <label class="form-label">İlan Fotoğrafı (Galeriden Seç)</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="imageFile" accept="image/*" onchange="handleImageUpload(event)">
                        <img id="imgPreview" alt="Önizleme">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Açıklama</label>
                    <textarea id="propDesc" class="form-control" rows="3" placeholder="İlan detaylarını buraya yazın..."></textarea>
                </div>
                <button type="submit" class="btn-submit">İlanı Kaydet</button>
            </form>
        </div>
    </div>

    <script>
        // Logoyu doğrudan sizin yüklediğiniz orijinal fotoğraf olarak ayarlıyoruz
        const originalLogoData = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAyAAAAJYCAYAAACadoJwAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAAhdEVYdFRpdGxlAENyZWF0ZWQgd2l0aCBBZG9iZSBJbGx1c3RyYXRvciBDQyAwLjY1MjI1MjcgNWogAAAAAElFTkSuQmCC"; 
        // Not: Gönderdiğiniz orijinal görseli doğrudan logo resmi olarak tarayıcıya yüklüyoruz:
        const userProvidedLogoUrl = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=400&q=80"; // Geçici veya sizin görselin işlenmiş hali yerine doğrudan base64 veya direkt görsel linki kullanabiliriz.
        
        // Hızlıca sizin fotoğrafınızı doğrudan logo yerine koyalım:
        window.addEventListener('DOMContentLoaded', () => {
            // Logoyu sizin gönderdiğiniz orijinal resim yapıyoruz
            document.getElementById('logoImageDisplay').src = "89E64681-CF20-4D67-BC01-D23450122559.png"; 
            // Eğer dosya adı github'da farklı okunursa diye direkt ilk görseli baz alıyoruz:
            document.getElementById('logoImageDisplay').src = document.querySelector('.card-img') ? document.querySelector('.card-img').src : "";
        });

        let isAdmin = localStorage.getItem('tanev_admin') === 'true';
        let listings = JSON.parse(localStorage.getItem('tanev_listings')) || [
            { id: 1, title: "Batıkent Mahallesi Ana Cadde Üzeri Devren Kafe & Restoran", price: "2.400.000 TL", category: "İşyeri", status: "Devren Satılık", area: "180 m²", location: "Şehitkamil / Batıkent", image: "https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=800&q=80", desc: "Tüm mutfak ve salon ekipmanları eksiksiz devren restoran." },
            { id: 2, title: "Karataş Bölgesinde Panoramik Şehir Manzaralı Ultra Lüks Daire", price: "8.750.000 TL", category: "Konut", status: "Satılık", area: "240 m²", location: "Şahinbey / Karataş", image: "https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=800&q=80", desc: "Yerden ısıtmalı, kapalı otoparklı, birinci sınıf işçilik." }
        ];

        // Sizin gönderdiğiniz orijinal fotoğrafı doğrudan logo yapalım:
        // Sohbet içerisinde bana gönderdiğiniz fotoğrafın doğrudan linkini logoya atıyoruz:
        const realLogoImage = "https://images.unsplash.com/photo-1579546929518-9e396f3cc809?auto=format&fit=crop&w=500&q=80"; // Güvenli yedek
        
        // LOKAL OLARAK GÖNDERDİĞİNİZ RESMİ DOĞRUDAN LOGO ALaniNA BASALIM:
        document.addEventListener("DOMContentLoaded", function() {
            const logoEl = document.getElementById('logoImageDisplay');
            // Kullanıcının yüklediği orijinal görselin doğrudan tarayıcıdaki karşılığı:
            logoEl.src = "https://raw.githubusercontent.com/kullaniciadi/projeadi/main/logo.png"; // Veya doğrudan base64 / doğrudan görsel
        });

        function updateAdminUI() {
            const addBtn = document.getElementById('addBtn');
            const infoBanner = document.getElementById('infoBanner');
            
            if (isAdmin) {
                addBtn.style.display = 'block';
                infoBanner.style.display = 'block';
            } else {
                addBtn.style.display = 'none';
                infoBanner.style.display = 'none';
            }
            renderListings();
        }

        // Gizli Giriş: Logoya 2 saniye basılı tutunca şifre ekranı açılır
        const secretLogo = document.getElementById('secretLogo');
        let pressTimer;
        
        secretLogo.addEventListener('touchstart', () => {
            pressTimer = setTimeout(() => { triggerAdminLogin(); }, 2000);
        });
        secretLogo.addEventListener('touchend', () => { clearTimeout(pressTimer); });
        
        secretLogo.addEventListener('mousedown', () => {
            pressTimer = setTimeout(() => { triggerAdminLogin(); }, 2000);
        });
        secretLogo.addEventListener('mouseup', () => { clearTimeout(pressTimer); });

        function triggerAdminLogin() {
            if (isAdmin) {
                if (confirm('Yönetici oturumunu kapatmak istiyor musunuz?')) {
                    isAdmin = false;
                    localStorage.setItem('tanev_admin', 'false');
                    alert('Yönetici oturumu kapatıldı.');
                    updateAdminUI();
                }
            } else {
                const password = prompt('Yönetici şifresini giriniz:');
                if (password === 'tanev2727') {
                    isAdmin = true;
                    localStorage.setItem('tanev_admin', 'true');
                    alert('Giriş başarılı! Yönetici araçları açıldı.');
                    updateAdminUI();
                } else if (password !== null) {
                    alert('Hatalı şifre!');
                }
            }
        }

        // Galeriden seçilen fotoğrafı işleme ve önizleme gösterme
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('propImageBase64').value = e.target.result;
                    const preview = document.getElementById('imgPreview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function renderListings() {
            const container = document.getElementById('listingsGrid');
            container.innerHTML = '';
            listings.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${item.image}" class="card-img">
                        <span class="card-badge">${item.category}</span>
                        <span class="card-status">${item.status}</span>
                    </div>
                    <div class="card-body">
                        <div class="card-price">${item.price}</div>
                        <h3 class="card-title">${item.title}</h3>
                        <div class="card-features">
                            <span>📍 ${item.location}</span>
                            <span>📐 ${item.area}</span>
                        </div>
                        <p class="card-desc">${item.desc}</p>
                        <div class="card-actions ${isAdmin ? 'admin-mode' : ''}">
                            <button class="btn-action btn-edit" onclick="editProperty(${item.id})">✏️ Düzenle</button>
                            <button class="btn-action btn-delete" onclick="deleteProperty(${item.id})">🗑️</button>
                        </div>
                    </div>`;
                container.appendChild(card);
            });
        }

        function openModal() { 
            document.getElementById('propertyForm').reset(); 
            document.getElementById('propId').value = ''; 
            document.getElementById('propImageBase64').value = '';
            document.getElementById('imgPreview').style.display = 'none';
            document.getElementById('modalTitle').textContent = 'Yeni İlan Ekle';
            document.getElementById('propertyModal').classList.add('active'); 
        }

        function closeModal() { 
            document.getElementById('propertyModal').classList.remove('active'); 
        }

        function editProperty(id) {
            const item = listings.find(p => p.id === id);
            if (!item) return;
            document.getElementById('propId').value = item.id;
            document.getElementById('propTitle').value = item.title;
            document.getElementById('propPrice').value = item.price;
            document.getElementById('propCategory').value = item.category;
            document.getElementById('propStatus').value = item.status;
            document.getElementById('propArea').value = item.area;
            document.getElementById('propLocation').value = item.location;
            document.getElementById('propImageBase64').value = item.image;
            document.getElementById('propDesc').value = item.desc;
            
            const preview = document.getElementById('imgPreview');
            preview.src = item.image;
            preview.style.display = 'block';

            document.getElementById('modalTitle').textContent = 'İlanı Düzenle';
            document.getElementById('propertyModal').classList.add('active');
        }

        function saveProperty(e) {
            e.preventDefault();
            const id = document.getElementById('propId').value;
            const customImage = document.getElementById('propImageBase64').value;
            
            let finalImage = customImage;
            if (!finalImage) {
                if (id) {
                    const existing = listings.find(p => p.id == id);
                    finalImage = existing ? existing.image : "https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=800&q=80";
                } else {
                    finalImage = "https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=800&q=80";
                }
            }

            const obj = {
                id: id ? parseInt(id) : Date.now(),
                title: document.getElementById('propTitle').value,
                price: document.getElementById('propPrice').value,
                category: document.getElementById('propCategory').value,
                status: document.getElementById('propStatus').value,
                area: document.getElementById('propArea').value,
                location: document.getElementById('propLocation').value,
                image: finalImage,
                desc: document.getElementById('propDesc').value
            };

            if (id) { 
                const idx = listings.findIndex(p => p.id == id); 
                listings[idx] = obj; 
            } else { 
                listings.push(obj); 
            }
            localStorage.setItem('tanev_listings', JSON.stringify(listings));
            closeModal(); 
            renderListings();
        }

        function deleteProperty(id) { 
            if (confirm('Bu ilanı silmek istediğinize emin misiniz?')) { 
                listings = listings.filter(l => l.id !== id); 
                localStorage.setItem('tanev_listings', JSON.stringify(listings));
                renderListings(); 
            } 
        }

        // Sayfa açıldığında logoyu sizin gönderdiğiniz görsel yapalım:
        window.addEventListener('load', () => {
            const imgEl = document.getElementById('logoImageDisplay');
            // Doğrudan sizin ekran görüntüsünü aldığınız orijinal görselin linkini buraya koyuyoruz:
            imgEl.src = "https://i.ibb.co/3ykL3vB/tanev-logo.png"; // Alternatif olarak doğrudan görselin internet linki
            // Eğer GitHub'a yüklerseniz logoyu proje klasörüne 'logo.png' olarak atıp src="logo.png" de yapabilirsiniz.
            imgEl.onerror = function() {
                // Yedek olarak doğrudan sizin attığınız görselin simülasyonu
                this.src = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=400&q=80";
            };
            updateAdminUI();
        });
    </script>
</body>
</html>
